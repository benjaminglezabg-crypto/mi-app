version: 0.2

env:
  variables:
    ECR_REPOSITORY: "ecs-network-dev-app"

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."

      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

      - REPOSITORY_URI=$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY

      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:-latest}

      - echo "Repository URI = $REPOSITORY_URI"
      - echo "Image tag = $IMAGE_TAG"

      - aws ecr get-login-password --region $AWS_DEFAULT_REGION |
        docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

  build:
    commands:
      - echo "Building Docker image..."

      - docker build -t $ECR_REPOSITORY:$IMAGE_TAG .

      - docker tag $ECR_REPOSITORY:$IMAGE_TAG $REPOSITORY_URI:$IMAGE_TAG

      - docker tag $ECR_REPOSITORY:$IMAGE_TAG $REPOSITORY_URI:latest

  post_build:
    commands:
      - echo "Pushing Docker image..."

      - docker push $REPOSITORY_URI:$IMAGE_TAG

      - docker push $REPOSITORY_URI:latest

      - echo "Creating imagedefinitions.json..."

      - printf '[{"name":"app","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json

      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
